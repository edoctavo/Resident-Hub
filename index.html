<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Resident Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#080c11;--panel:#0f161e;--raise:#172230;--line:#223042;--ink:#e7eef4;--mute:#8497a8;--accent:#9ad1ff;--on:#07121c;--warn:#ff9b6b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;color:var(--ink);font:400 15px/1.55 Manrope,system-ui,sans-serif;min-height:100vh;background:radial-gradient(rgba(154,209,255,.09) 1px,transparent 1px) 0 0/24px 24px,radial-gradient(900px 420px at 8% -8%,#15304a 0,transparent 65%),radial-gradient(700px 500px at 100% 100%,#1c1636 0,transparent 60%),var(--bg);background-attachment:fixed}
h1,h2,h3,h4{font-family:"Bricolage Grotesque",Manrope,sans-serif;margin:0;letter-spacing:-.015em}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
nav{border-right:1px solid var(--line);padding:22px 12px;position:sticky;top:0;align-self:start;height:100vh;overflow:auto;background:rgba(8,12,17,.7);backdrop-filter:blur(6px)}
.brand{font:700 21px "Bricolage Grotesque",sans-serif;padding:0 10px 16px;display:flex;gap:8px;align-items:center}
nav a{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;color:var(--mute);text-decoration:none;font-weight:500}
nav a small{margin-left:auto;opacity:.7}
nav a:hover{color:var(--ink);background:var(--panel)}
nav a.on{color:var(--on);background:var(--accent)}
.ic{width:19px;height:19px;flex:none}
#st{color:var(--mute);font-size:12px;padding:14px 10px 0}
main{padding:28px clamp(16px,4vw,44px);max-width:1080px;width:100%}
.hero{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:16px;padding:26px 28px;margin-bottom:18px;background:linear-gradient(120deg,#12304a 0,#101a28 55%,#1d1a3a 100%)}
.hero svg{position:absolute;right:-30px;top:-10px;width:340px;color:#9ad1ff;opacity:.13;transform:rotate(-18deg)}
.hero h1{font-size:clamp(30px,5.5vw,48px);line-height:1.05;position:relative}
.hero p{color:var(--mute);margin:8px 0 0;position:relative}
.rb{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.rb button{--c:var(--accent);display:flex;gap:7px;align-items:center;font:500 13px Manrope,sans-serif;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:6px 13px;cursor:pointer}
.rb button i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.rb button.on{background:var(--c);color:var(--on);border-color:var(--c);font-weight:700}
.rb button.on i{background:var(--on)}
.rb button:first-child i{display:none}
.stats{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:12px;background:var(--panel);margin-bottom:22px;overflow:hidden}
.stat{flex:1 1 150px;padding:15px 18px;border-right:1px solid var(--line)}
.stat:last-child{border:0}
.stat b{display:block;font:700 28px "Bricolage Grotesque",sans-serif;color:var(--accent)}
.stat span{color:var(--mute);font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.tile{display:block;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);text-decoration:none}
.tile:hover{border-color:var(--accent);background:var(--raise)}
.tile .ic{width:38px;height:38px;padding:8px;border-radius:10px;background:rgba(154,209,255,.12);color:var(--accent);margin-bottom:10px}
.tile h3{font-size:18px}.tile p{margin:3px 0 8px;color:var(--mute);font-size:13px}.tile em{font-style:normal;color:var(--accent);font-size:13px;font-weight:500}
.up{margin-top:26px}.up h2{font-size:19px;margin-bottom:10px}
.row{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);margin-bottom:8px}
.main{flex:1;min-width:0}
.t{font-weight:700;overflow-wrap:anywhere}.t a{color:var(--accent)}
.m{color:var(--mute);font-size:13px;margin-top:2px;overflow-wrap:anywhere}
.body{white-space:pre-wrap;margin-top:6px;font-size:14px}
.done .t{text-decoration:line-through;color:var(--mute)}
.chip{display:inline-block;padding:1px 9px;border-radius:99px;background:var(--warn);color:var(--on);font-size:12px;font-weight:700}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.acts button,.lk{background:none;border:0;color:var(--mute);cursor:pointer;font:inherit;font-size:13px;padding:2px 6px}
.acts button:hover,.lk:hover{color:var(--accent)}
.head{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.head .ic{width:34px;height:34px;padding:7px;border-radius:10px;background:rgba(154,209,255,.12);color:var(--accent)}
.head h1{font-size:32px}.sum{color:var(--mute);margin:2px 0 14px}
.form,.props{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);margin-bottom:14px}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mute);gap:4px}
.wide{grid-column:1/-1}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
input[type=file]{padding:6px}
input[type=checkbox]{width:auto}
textarea{min-height:90px;resize:vertical}
.btn{font:700 14px Manrope,sans-serif;background:var(--accent);color:var(--on);border:0;border-radius:8px;padding:9px 16px;cursor:pointer}
.btn.ghost{background:var(--raise);color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.empty{color:var(--mute);padding:20px;border:1px dashed var(--line);border-radius:12px;text-align:center}
.nb{display:grid;grid-template-columns:270px 1fr;gap:16px;align-items:start}
.nl{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
.it{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);margin-top:8px;cursor:pointer}
.it:hover{border-color:var(--mute)}.it.on{border-color:var(--accent);background:var(--raise)}
.it .t{font-size:14px}.it .m{font-size:12px}
.ttl{font:700 26px "Bricolage Grotesque",sans-serif;background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:6px 0;margin-bottom:12px}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 8px;align-items:center}
.tools button{font:700 13px Manrope,sans-serif;color:var(--ink);background:var(--raise);border:1px solid var(--line);border-radius:7px;padding:5px 10px;cursor:pointer}
.tools button:hover{border-color:var(--accent)}
.tools select{width:auto;padding:5px 8px;font-size:13px}
.bd{min-height:380px;line-height:1.65}
.pv{min-height:380px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.pv h3{font-size:20px;margin:12px 0 4px}.pv h4{font-size:16px;margin:10px 0 2px;color:var(--accent)}
.pv a{color:var(--accent)}.gap{height:8px}.dn{text-decoration:line-through;color:var(--mute)}
.th{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.th div{position:relative}
.th img{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;display:block}
.th button{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:0;background:var(--warn);color:var(--on);cursor:pointer;font-weight:700;line-height:1}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.quick a{padding:6px 12px;border:1px solid var(--line);border-radius:99px;color:var(--accent);text-decoration:none;font-size:13px;background:var(--panel)}
.foot{margin-top:30px;padding-top:14px;border-top:1px solid var(--line);color:var(--mute);font-size:13px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mg{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.mg input{width:180px}
.gate{max-width:460px;margin:12vh auto;padding:0 20px}.gate h1{font-size:38px;margin-bottom:10px}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:20;cursor:zoom-out;padding:16px}
#lb img{max-width:100%;max-height:100%;border-radius:8px}
#ts{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--raise);border:1px solid var(--accent);padding:8px 16px;border-radius:99px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;font-size:13px}
@media (max-width:820px){
.app{display:block}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;height:auto;display:flex;gap:4px;overflow-x:auto;padding:10px 8px;border-right:0;border-bottom:1px solid var(--line);background:var(--bg)}
.brand,#st,nav small{display:none}
nav a{white-space:nowrap;flex:none}
.nb{display:block}.nl{position:static;max-height:260px}#ed{margin-top:14px}
}

nav a .ic{color:var(--mc,currentColor)}nav a.on .ic{color:var(--on)}
.tile{border-top:3px solid var(--mc,var(--line));transition:transform .15s,box-shadow .15s}
.tile:hover{transform:translateY(-3px);box-shadow:0 10px 28px -12px var(--mc,#9ad1ff);border-color:var(--mc,var(--accent))}
.tile .ic{background:color-mix(in srgb,var(--mc,#9ad1ff) 20%,transparent);color:var(--mc,var(--accent))}
.tile em{color:var(--mc,var(--accent))}
.hero{background-size:220% 220%;animation:sh 14s ease infinite}
@keyframes sh{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
@media (prefers-reduced-motion:reduce){.hero{animation:none}.tile{transition:none}}
.bd2{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:99px;margin-left:6px;color:var(--on);background:var(--c,var(--accent))}
.stbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.soap{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:10px}
.soap label{border-left:4px solid var(--c);padding-left:10px;color:var(--ink)}
.soap .sl b{color:var(--c);font:700 20px "Bricolage Grotesque",sans-serif}
.soap textarea{min-height:130px}
.sec{margin:18px 0 6px;font-size:15px}
.lc{display:inline-flex;gap:6px;align-items:center;background:var(--raise);border:1px solid var(--line);border-radius:99px;padding:3px 6px 3px 12px;margin:0 6px 6px 0;font-size:13px}
.lc button{background:none;border:0;color:var(--warn);cursor:pointer}
.trs{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.tr{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--panel)}
.tr svg{width:100%;height:44px}.ar{color:var(--warn);font-weight:700}
.rv{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--panel);white-space:pre-wrap}
.rv .k{color:var(--accent);font-weight:700}
.calbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}.calbar h2{font-size:20px;margin-left:6px}.sp{flex:1}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--mute);margin-bottom:8px}.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;min-width:700px;margin-bottom:20px}
.dw{text-align:center;font-size:12px;color:var(--mute);font-weight:700}
.dc{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px;min-height:96px}
.cal.week .dc{min-height:180px}
.dc.td{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}.dc.off{opacity:.45}
.dc>b{font-size:12px;color:var(--mute)}
.ev,.tdo{font-size:11px;border-radius:5px;padding:2px 5px;margin-top:3px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev{background:color-mix(in srgb,var(--c) 25%,transparent);border-left:3px solid var(--c)}
.tdo{border:1px dashed var(--c)}.tdo.dn{opacity:.5;text-decoration:line-through}
.cal.week .ev,.cal.week .tdo{white-space:normal}
.more{font-size:11px;color:var(--mute);margin-top:3px}
.rb.gt button{--c:#ff8fb1}
.it{position:relative}.dx{position:absolute;top:4px;right:4px;font-size:13px;white-space:nowrap}
.sw{display:inline-flex;flex-direction:row;align-items:center;gap:8px;padding:8px 14px;border:1px solid var(--line);border-radius:8px;background:var(--raise);color:var(--ink);font-size:14px;cursor:pointer}
a.btn{display:inline-block;text-decoration:none}
</style>
</head>

 files.reduce(function(p,f){return p.then(function(){return shrink(f)}).then(function(b){return AS.upload(b)}).then(function(r){done(r.id)}).catch(function(){toast("A photo could not be uploaded")})},Promise.resolve());
